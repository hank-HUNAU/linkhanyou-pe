<!-- ============================================================
     P1-1 首屏关键 CSS 内联（2026-10-27 性能优化方案 v2）
     规则逐字取自 ui.css / style.css（来源行号见各段注释），
     外部 CSS 异步到达后同值覆盖、零跳动。
     :root 整段照抄 ui.css:16-76 —— 变量单一来源，不省略不剔除。
     ============================================================ -->
<style>
/* ---- ui.css:16-76 设计变量（逐字照抄） ---- */
:root{
  /* 主色 */
  --primary:#0071e3; --primary-dark:#0058b0; --primary-light:#eaf3fd;
  /* 语义色 */
  --green:#1c6e31; --green-bg:#e6f4ea;
  --red:#d70015; --red-bg:#fdeced;
  --amber:#a35a00; --amber-bg:#fdf0e3;
  /* 中性色 */
  --bg:#f5f5f7; --card:#fff; --border:rgba(0,0,0,.08);
  --text:#1d1d1f; --text-2:#515154; --muted:#6e6e73; --sk:rgba(0,0,0,.06);
  /* 步骤色 */
  --step1:#0f766e; --step1-bg:#e6f5f3;
  --step2:#0058b0; --step2-bg:#eaf3fd;
  --step3:#1a5fd0; --step3-bg:#eaf2ff;
  /* 圆角四档 */
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px; --radius:14px;
  /* 圆角补充档 */
  --r-xs:3px; --r-sm2:6px; --r-md2:12px; --r-xl:16px; --r-22:22px;
  /* 字号七档 */
  --fs-2xs:12px; --fs-xs:12.5px; --fs-sm:13.5px; --fs-base:15px; --fs-read:17px;
  --fs-lg:20px; --fs-xl:24px;
  --fs-14:14px; --fs-22:22px; --fs-26:26px; --fs-30:30px; --fs-11:11px; --fs-23:23px;
  /* 兼容别名：老代码写 --fs-md 的仍指到通用正文 */
  --fs-md:var(--fs-base);
  /* 行高三档 */
  --lh-tight:1.4; --lh-normal:1.6; --lh-read:1.8;
  /* 响应式专用字号三档 */
  --fs-narrow-ref:14.5px; --fs-narrow-read:16.5px; --fs-touch:16px;
  --r-xs2:2px;
  /* 间距六档 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* 阴影两档 */
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --shadow-lg:0 20px 60px rgba(0,0,0,.2);
  /* 兼容别名 */
  --yc:var(--primary); --ycd:var(--primary-dark); --ycl:var(--primary-light);
  --bd:var(--border); --tx:var(--text); --tx2:var(--text-2); --mut:var(--muted);
  --g:var(--green); --gb:var(--green-bg);
  --r:var(--red); --rb:var(--red-bg);
  --a:var(--amber); --ab:var(--amber-bg);
  --an:var(--step1); --and:#0d5f59; --anl:var(--step1-bg);
}

/* ---- ui.css:79-105 基础 + 焦点态（逐字照抄） ---- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* 滚动条预留位：overflow-y:scroll 全程恒定，全站零布局跳动（2026-10-19） */
html{overflow-y:scroll}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:var(--fs-md); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---- ui.css:108-116 按钮 / ui.css:124 标签基（home.js 渲染内容可能先于外部 CSS） ---- */
.btn{
  border:none;border-radius:var(--r-pill);padding:8px 16px;font-size:var(--fs-sm);font-weight:500;
  display:inline-flex;align-items:center;gap:5px;transition:filter .15s ease,background .15s ease;
  text-decoration:none;line-height:1.6;
}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary,.btn-p{background:var(--primary);color:#fff}
.btn-primary:hover,.btn-p:hover{background:var(--primary-dark);filter:none}
.tag{display:inline-block;padding:2px 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}

/* ---- ui.css:185-192 Toast（逐字照抄） ---- */
.toast,#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;
  padding:10px 18px;border-radius:var(--r-md);font-size:13px;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .2s;
}
#toast:empty,.toast:empty{display:none!important}

/* ---- ui.css:213-218 启动骨架 + 脉动动画 + 减动效（逐字照抄） ---- */
.boot-skeleton{max-width:1180px;margin:0 auto;padding:28px 20px}
.boot-skeleton .sk-t{height:22px;width:190px;border-radius:var(--r-sm);background:var(--sk);margin-bottom:18px}
.boot-skeleton .sk-c{height:108px;border-radius:var(--r-lg);background:var(--sk);margin-bottom:14px}
.boot-skeleton .sk-t,.boot-skeleton .sk-c{animation:sk-pulse 1.2s ease-in-out infinite}
@keyframes sk-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.boot-skeleton .sk-t,.boot-skeleton .sk-c{animation:none}}

/* ---- ui.css:227-232 @620 骨架收紧（逐字照抄） ---- */
@media (max-width:620px){
  .boot-skeleton{padding:20px 14px}
}

/* ---- style.css:33-37 main 限宽 + 工作台首页豁免（逐字照抄） ---- */
main { max-width: 1180px; margin: 0 auto; padding: 26px 20px 60px; }
body.wb-home #app { max-width: none; margin: 0; padding: 0; }

/* ---- style.css:222-296 工作台首页 v2 全段（逐字照抄，含 @1280/@900） ---- */
.wb-app { display: flex; min-height: 100vh; background: linear-gradient(180deg, #e9ecf7 0%, #f6f7fb 240px); }
.wb-side { width: 216px; background: linear-gradient(180deg, #1e1b4b 0%, #14173d 100%); color: #d0d5dd; padding: 22px 0; flex-shrink: 0; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(23, 23, 63, .15); }
.wb-logo { padding: 0 20px 16px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.wb-logo h1 { font-size: var(--fs-read); color: #fff; font-weight: 700; }
.wb-logo p { font-size: var(--fs-2xs); color: #8b94a7; margin-top: 4px; }
.wb-nav { flex: 1; overflow-y: auto; padding: 10px 0; }
.wb-nav a { display: flex; align-items: center; gap: 9px; margin: 3px 12px; padding: 10px 14px; border-radius: var(--r-md2); font-size: var(--fs-14); color: #d0d5dd; text-decoration: none; transition: all .15s ease; }
.wb-nav a:hover { color: #fff; background: rgba(255, 255, 255, .06); }
.wb-nav a.on { background: linear-gradient(90deg, #4f46e5, #7c3aed); color: #fff; box-shadow: 0 4px 14px rgba(79, 70, 229, .4); font-weight: 500; }
.wb-nav .tag { margin-left: auto; background: #2f9e44; color: #fff; font-size: var(--fs-11); padding: 1px 7px; border-radius: var(--r-pill); }
.wb-foot { padding: 14px 20px 0; border-top: 1px solid rgba(255, 255, 255, .08); font-size: var(--fs-2xs); color: #8b94a7; }
.wb-content { flex: 1; min-width: 0; }
.wb-foot-acts { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.wb-foot-acts a, .wb-foot-acts .wb-acc { display: block; padding: 7px 0; font-size: var(--fs-xs); color: #d0d5dd; text-decoration: none; border-radius: var(--r-sm); }
.wb-foot-acts a:hover { color: #fff; background: rgba(255, 255, 255, .06); padding-left: 8px; padding-right: 8px; }
.wb-foot-acts .wb-acc { color: #8b94a7; cursor: default; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wb-foot-acts .hidden { display: none; }
body.answering .wb-side { display: none !important; }
body.answering .wb-app { display: block !important; }
.wb-app > .wb-content { max-width: none; }
.wb-main { flex: 1; padding: 32px 40px 48px; min-width: 0; max-width: 1680px; margin: 0 auto; }
@media (max-width: 1280px) {
  .wb-main { padding: 26px 28px 40px; }
  .wb-hero-stats { gap: 40px; }
  .wb-grid3 { gap: 20px; }
  .wb-card, .wb-mini { margin-top: 20px; }
}
.wb-focus { background: linear-gradient(120deg, #4338ca 0%, #6d28d9 55%, #a21caf 100%); color: #fff; border-radius: var(--r-22); padding: 32px 36px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(67, 56, 202, .35); }
.wb-focus::before { content: ''; position: absolute; left: -40px; bottom: -90px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 255, 255, .07); }
.wb-focus > * { position: relative; }
.wb-focus .hn-tag { font-size: var(--fs-2xs); font-weight: 600; opacity: .85; letter-spacing: .04em; }
.wb-focus .hn-why { font-size: var(--fs-14); line-height: 1.7; margin-top: 8px; opacity: .95; }
.wb-focus .hn-tip { font-size: var(--fs-xs); margin-top: 6px; color: #ffe08a; }
.wb-hero-big { font-size: var(--fs-22); font-weight: 700; margin-top: 8px; }
.wb-hero-input { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.wb-hero-input input { flex: 1; min-width: 220px; padding: 10px 14px; border: none; border-radius: var(--r-md); font-size: var(--fs-14); font-family: inherit; }
.wb-hero-btn { display: inline-block; margin-top: 16px; background: #fff; color: #4338ca; border: none; border-radius: var(--r-pill, 999px); padding: 10px 22px; font-size: var(--fs-14); font-weight: 600; cursor: pointer; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
.wb-hero-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
.wb-hero-stats { display: flex; gap: 56px; margin-top: 22px; flex-wrap: wrap; }
.wb-hero-stats .n { font-size: var(--fs-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
.wb-hero-stats .l { font-size: var(--fs-2xs); opacity: .85; margin-top: 2px; }
.wb-theory { margin-top: 16px; font-size: var(--fs-xs); color: rgba(255,255,255,.75); }
.wb-theory span { opacity: .65; margin-left: 6px; font-size: var(--fs-11); }
.wb-card { background: #fff; border-radius: var(--r-xl); padding: 24px 26px; box-shadow: 0 1px 3px rgba(16, 24, 40, .08); margin-top: 26px; }
.wb-card h3 { font-size: var(--fs-base); margin-bottom: 10px; color: var(--text, #1d1d1f); }
.wb-last { font-size: var(--fs-sm); color: var(--text-2, #6e6e73); line-height: 2; }
.wb-grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 26px; }
.wb-mini { background: #fff; border-radius: var(--r-xl); padding: 22px 24px; box-shadow: 0 1px 3px rgba(16, 24, 40, .08); margin-top: 26px; }
.wb-mini .mt { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-11); font-weight: 600; color: #fff; padding: 3px 10px; border-radius: var(--r-pill); }
.wb-mini .m1 { background: var(--s1, #0aa574); }
.wb-mini .m2 { background: var(--primary, #0071e3); }
.wb-mini .m3 { background: var(--s3, #4f46e5); }
.wb-mini .mp { font-size: var(--fs-xs); color: var(--text-2, #6e6e73); line-height: 1.7; margin-top: 8px; }
.wb-mini a { color: var(--primary, #0071e3); font-size: var(--fs-sm); }
@media (max-width: 900px) {
  .wb-app { display: block; }
  .wb-side { position: sticky; top: 0; z-index: 60; height: auto; width: 100%; flex-direction: row; align-items: center; padding: 8px 10px; gap: 8px; overflow-x: auto; }
  .wb-logo { border: none; padding: 0 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .wb-logo h1 { font-size: var(--fs-14); white-space: nowrap; }
  .wb-logo p { display: none; }
  .wb-nav { display: flex; padding: 0; }
  .wb-nav a { margin: 0; padding: 8px 12px; white-space: nowrap; }
  .wb-nav .tag { display: none; }
  .wb-foot { display: none; }
  .wb-main { padding: 18px 14px 40px; }
  .wb-grid3 { grid-template-columns: 1fr; }
}
</style>

<!-- P0-2：prefetch 首屏内容脚本（低优先级并发拉取；未登录时 mtpeBoot 直接返回，preload 会白下，故用 prefetch） -->
<link rel="prefetch" as="script" href="home.js?v=17a">
</head>
<body>

<div id="mtpe-nav"></div>

<!-- P0-1（2026-10-27）：
     · 移除 nav.js —— 首页空操作（nav.js:133），home.js 自渲染工作台外壳（home.js:132-194）；
       --mtpe-nav-h 首页无消费者。sw.js CORE 已同步移除。
     · pwa.js / help.js 改 defer —— SW 注册挂 window load（pwa.js:47）、帮助按钮运行时兜底
       （home.js:147），执行顺序安全。
     · unlock.js 保持同步 —— 定义 mtpeBoot 供下方内联脚本调用，且需尽早判登录态。 -->
<script src="pwa.js" defer></script>
<script src="unlock.js"></script>
<script src="help.js" defer></script>
<!-- secure.js（密钥环 + 元数据片，约 10KB）不在这里加载：已登录时用不到它，
     只有输入口令时 unlock.js 才按需拉取，页面空下来后会自动预取。
     语料分片（s-tasks.js / s-pairs.js）由二级页按需拉取。 -->
<main id="app"><!-- 语料分片解密期间先显示骨架，页面脚本就绪后整块替换 -->
  <div class="boot-skeleton"><div class="sk-t"></div><div class="sk-c"></div><div class="sk-c"></div></div>
</main>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!-- home.js 不依赖语料，但要等 unlock.js 判定完登录态（未登录就不渲染半空页面） -->
<script>window.mtpeBoot('home.js?v=17a');</script>
</body>
